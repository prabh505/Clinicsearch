# ClinicSearch — Jipok/website-to-apk configuration
#
# IMPORTANT: Replace YOUR_LAPTOP_IP below with your actual laptop's WiFi IP.
# Find it on macOS with:    ipconfig getifaddr en0
#
# This config produces a fullscreen WebView wrapper that loads the
# Streamlit app running on the laptop.

id = clinicsearch
name = ClinicSearch
mainURL = http://YOUR_LAPTOP_IP:8501/?embed=true
icon = icon.png

# Critical: Streamlit needs JavaScript and localStorage
JSEnabled = true
DomStorageEnabled = true
DatabaseEnabled = true

# Allow loading over plain HTTP (we're on local WiFi, not internet)
allowMixedContent = true

# Don't cache aggressively — we want fresh content from Streamlit each session
cacheMode = no_cache

# Allow connecting to local network IPs (192.168.x.x, 10.x.x.x)
blockLocalhostRequests = false

# Visual polish
edgeToEdge = true
fadeInDuration = 200
